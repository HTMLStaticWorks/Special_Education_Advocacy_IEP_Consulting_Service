<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login (Demo) | Guided Path Advocacy</title>
  <meta name="description" content="Front-end demonstration login interface for Guided Path Advocacy clients.">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>

<body class="d-flex flex-column min-vh-100 justify-content-center bg-warm position-relative">

  <!-- Top Right Theme & RTL Controls -->
  <div class="position-absolute top-0 end-0 p-3 d-flex align-items-center gap-2 z-3">
    <button class="rtl-toggle-btn btn btn-sm btn-outline-teal" type="button" aria-label="Toggle RTL mode">RTL</button>
    <button class="theme-toggle-btn btn btn-sm btn-outline-teal" type="button" aria-label="Toggle theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">

        <!-- Back Link & Brand Logo -->
        <div class="text-center mb-4">
          <a class="navbar-brand navbar-brand-logo justify-content-center mb-2" href="index.html">
            <i class="bi bi-compass-fill"></i>
            <span>Guided Path <small class="d-block fs-6 text-muted fw-normal">Advocacy & IEP Consulting</small></span>
          </a>
          <p class="text-muted small">Account Demonstration Access</p>
        </div>

        <div class="p-4 p-md-5 rounded-4 bg-surface border border-subtle shadow-md">
          <h1 class="h3 font-heading text-center mb-1">Welcome Back</h1>
          <p class="text-muted small text-center mb-4">Sign in to access your saved resources and consultation records.</p>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="loginEmail" class="form-label-custom">Email Address</label>
              <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="parent@example.com" required>
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label-custom">Password</label>
              <div class="password-toggle-group">
                <input type="password" class="form-control form-control-custom pe-5" id="loginPassword" placeholder="••••••••" required>
                <button type="button" class="password-toggle-btn" data-target="loginPassword" aria-label="Toggle password visibility">
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">
                  Remember me
                </label>
              </div>
              <a href="forgot-password.html" class="small text-teal">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-teal btn-custom w-100 mb-4">Sign In to Account</button>

            <!-- Social Login Options (Bottom) -->
            <div class="position-relative text-center mb-4">
              <hr class="border-subtle my-0">
              <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface text-muted small">or sign in with</span>
            </div>

            <div class="d-flex flex-column flex-sm-row gap-2 mb-4">
              <button type="button" class="btn btn-social">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                  <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/>
                  <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                  <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                  <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                <span>Google</span>
              </button>
              <button type="button" class="btn btn-social">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.12-1 .04-2.22.67-2.92 1.49-.63.73-1.18 1.9-1.03 3.04 1.12.09 2.29-.59 2.96-1.41z"/>
                </svg>
                <span>Apple</span>
              </button>
            </div>

            <div class="text-center text-muted small">
              Don't have an account? <a href="signup.html" class="text-teal fw-bold">Create Account</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <button class="back-to-top" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
