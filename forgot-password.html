<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password (Demo) | Guided Path Advocacy</title>
  <meta name="description" content="Password reset request form for Guided Path Advocacy client portal demo.">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center bg-warm position-relative">

  <!-- Top Right Theme & RTL Controls -->
  <div class="position-absolute top-0 end-0 p-3 d-flex align-items-center gap-2 z-3">
    <button class="rtl-toggle-btn btn btn-sm btn-outline-teal" type="button" aria-label="Toggle RTL mode">RTL</button>
    <button class="theme-toggle-btn btn btn-sm btn-outline-teal" type="button" aria-label="Toggle theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        
        <div class="text-center mb-4">
          <a class="navbar-brand navbar-brand-logo justify-content-center mb-2" href="index.html">
            <i class="bi bi-compass-fill"></i>
            <span>Guided Path <small class="d-block fs-6 text-muted fw-normal">Advocacy & IEP Consulting</small></span>
          </a>
          <p class="text-muted small">Account Recovery Demonstration</p>
        </div>

        <div class="p-4 p-md-5 rounded-4 bg-surface border border-subtle shadow-md">
          <h1 class="h3 font-heading text-center mb-1">Reset Your Password</h1>
          <p class="text-muted small text-center mb-4">Enter your email address and we'll send you instructions to reset your password.</p>

          <form id="forgotPasswordForm" novalidate>
            <div class="mb-4">
              <label for="resetEmail" class="form-label-custom">Account Email Address</label>
              <input type="email" class="form-control form-control-custom" id="resetEmail" placeholder="parent@example.com" required>
            </div>

            <button type="submit" class="btn btn-teal btn-custom w-100 mb-3">Send Reset Link</button>

            <div class="text-center text-muted small">
              Remember your password? <a href="login.html" class="text-teal fw-bold">Sign In</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <button class="back-to-top" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
